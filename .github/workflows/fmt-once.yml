name: One-time fmt diagnostics

on:
  push:
    branches: ["dev/v8"]

permissions:
  contents: write

jobs:
  fmt:
    if: github.actor == 'mustafaakalin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v8
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt
      - run: |
          set +e
          cargo fmt --all > /tmp/fmt.log 2>&1
          cat /tmp/fmt.log
          exit 0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmt-error
          path: /tmp/fmt.log
      - run: |
          git rm .github/workflows/fmt-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: remove temporary fmt workflow"
          git push origin HEAD:dev/v8
