name: One-time rustfmt repair

on:
  push:
    branches: ["dev/v8"]

permissions:
  contents: write

jobs:
  fmt:
    if: github.actor == 'mustafaakalin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v8
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt
      - run: cargo fmt --all
      - run: |
          git rm .github/workflows/fmt-once.yml
          if git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "ci: remove temporary formatter workflow"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "ci: apply rustfmt"
          fi
          git push origin HEAD:dev/v8
