name: One-time Rust formatting

on:
  push:
    branches: ["dev/v8"]

permissions:
  contents: write

jobs:
  format:
    if: github.actor == 'mustafaakalin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v8
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt
      - name: Run rustfmt and capture diagnostics
        run: |
          set +e
          cargo fmt --all > /tmp/rustfmt.log 2>&1
          status=$?
          cat /tmp/rustfmt.log
          echo "RUSTFMT_STATUS=$status" >> "$GITHUB_ENV"
          exit 0
      - name: Upload rustfmt diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-diagnostics
          path: /tmp/rustfmt.log
      - name: Commit formatting changes
        if: env.RUSTFMT_STATUS == '0'
        run: |
          if git diff --quiet; then
            echo "already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: apply rustfmt"
          git push origin HEAD:dev/v8
