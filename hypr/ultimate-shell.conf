# wem0x01 — Wayland environment manager integration
# The environment daemon is the source of system state.
# The Quickshell frontend remains optional.

exec-once = systemctl --user start wem0x01.service
exec-once = qs -c ultimate-shell

# wem0x01 frontend surfaces
bind = SUPER, SPACE, global, quickshell:ultimate-launcher
bind = SUPER, N, global, quickshell:ultimate-notifications
bind = SUPER, C, global, quickshell:ultimate-control
bind = SUPER, M, global, quickshell:ultimate-media
bind = SUPER, ESCAPE, global, quickshell:ultimate-close

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
